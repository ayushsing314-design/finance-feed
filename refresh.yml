name: Auto refresh feed

on:
  schedule:
    # Runs every 30 minutes. GitHub does not guarantee the exact minute,
    # actual runs can lag by a few minutes during busy periods, that's normal.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh endpoint
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/refresh" || echo "Refresh call failed or was on cooldown, that's fine"
